name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: filaretti_dev
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: filaretti_dev
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U filaretti_dev -d filaretti_dev"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: development
      API_INTERNAL_URL: http://localhost:3001
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_PATH: /api/v1
      MOCK_CONTENT: 'true'
      DATABASE_URL: postgresql://filaretti_dev:ci-test-only-password@127.0.0.1:5434/filaretti_dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:design-system
      - run: pnpm test:integration
      - run: pnpm build
      - name: Local recovery rehearsal against the isolated CI PostgreSQL service
        run: pnpm test:recovery
        env:
          F8_PG_CONTAINER: ${{ job.services.postgres.id }}
      - name: Install reproducible browser runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Integrated F8 QA with protected local indexing
        run: pnpm test:f8
        env:
          F8_TEST_BROWSER_CHANNEL: chromium
      - name: Critical CMS publication and private relationship flows
        run: |
          pnpm test:cms
          pnpm test:relationship
        env:
          F6_TEST_BROWSER_CHANNEL: chromium
          F7_TEST_BROWSER_CHANNEL: chromium
      - name: Record artifact identity and scope
        if: success()
        run: node scripts/ci-artifact.mjs
      - name: Retain sanitized QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f8-evidence-${{ github.sha }}
          path: |
            .local/f8-qa-smoke.json
            .local/f8-layout-smoke.json
            .local/f8-lighthouse-smoke.json
            .local/f8-qa-evidence/
            .local/f8-recovery.json
            .local/f6-qa-smoke.json
            .local/f7-qa-smoke.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Retain build for manual staging review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: review-build-${{ github.sha }}
          path: |
            .local/ci-artifact.json
            apps/api/dist/
            packages/config/dist/
            apps/web/.next/
            !apps/web/.next/cache/**
            !apps/web/.next/trace
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
