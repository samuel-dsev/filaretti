name: filaretti-stage

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    env_file: ./private/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]
    mem_limit: 320m
    cpus: 0.30
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  api:
    image: ${FILARETTI_API_IMAGE:?Set the reviewed API image}
    restart: unless-stopped
    env_file: ./private/api.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - storage:/data/storage
    networks: [private]
    mem_limit: 384m
    cpus: 0.35
    pids_limit: 96
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *logging

  web:
    image: ${FILARETTI_WEB_IMAGE:?Set the reviewed web image}
    restart: unless-stopped
    env_file: ./private/web.env
    depends_on:
      api:
        condition: service_healthy
    networks: [private]
    mem_limit: 512m
    cpus: 0.40
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/admin/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 6
      start_period: 40s
    logging: *logging

  ingress:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./ingress.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      private:
      proxy:
        aliases: [filaretti-stage-ingress]
    mem_limit: 48m
    cpus: 0.10
    pids_limit: 64
    cap_drop: [NET_RAW]
    security_opt: [no-new-privileges:true]
    logging: *logging

  operations:
    profiles: [operations]
    image: ${FILARETTI_OPS_IMAGE:?Set the reviewed operations image}
    env_file:
      - ./private/api.env
      - ./private/import.env
    volumes:
      - ./snapshot:/snapshot:ro
    networks: [private]
    mem_limit: 384m
    cpus: 0.35
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging

volumes:
  postgres_data:
  storage:
    external: true
    name: filaretti-stage_storage

networks:
  private:
  proxy:
    external: true
    name: easypanel
